<g fill="#183949" font-size="24" font-weight="700"><text x="52" y="147">初始免疫状态</text><text x="383" y="147">细胞与空间重塑</text><text x="714" y="147">病理与长期结局</text></g>
<g fill="#4a6472" font-size="18"><text x="52" y="183">谱系、克隆、空间邻域</text><text x="383" y="183">配对单细胞、空间、多重染色</text><text x="714" y="183">pCR、EFS、随机治疗比较</text></g>
<rect x="30" y="254" width="940" height="47" rx="11" fill="#e1f3ee"/>
<text x="48" y="284" fill="#23574d" font-size="20" font-weight="650">治疗后应答相关 ≠ 治疗前预测 ≠ 治疗差异获益</text></g></svg>
