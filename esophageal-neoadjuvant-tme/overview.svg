<g font-family="system-ui, Microsoft YaHei, sans-serif">
<text x="30" y="41" fill="#205a70" font-size="19" font-weight="700" letter-spacing="2">TRANSLATIONAL ATLAS / ESOPHAGEAL CANCER</text>
<g fill="white" stroke="#c9e1ea"><rect x="30" y="67" width="278" height="173" rx="16"/><rect x="361" y="67" width="278" height="173" rx="16"/><rect x="692" y="67" width="278" height="173" rx="16"/></g>
<path d="M316 149h37m294 0h37" stroke="#7598ad" stroke-width="3" marker-end="url(#arr)"/>
